# Пробрасывает порты БД и кэша наружу — только для локальной разработки,
# чтобы подключиться к ним с машины разработчика.
#
# ВАЖНО: слева обязательно 127.0.0.1. Без этого docker публикует порт на все
# интерфейсы и проходит МИМО ufw — правила ufw висят на INPUT, а трафик к
# контейнерам идёт через FORWARD. База оказывается открыта в интернет, и
# `ufw status` об этом не скажет.
#
# На сервере этот файл использовать нельзя: там 5432 уже занят системным
# постгресом, и `docker compose up` без явного `-f docker-compose.yml`
# подхватит override и подерётся с ним за порт. Деплой-хук поэтому всегда
# указывает файл явно.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
