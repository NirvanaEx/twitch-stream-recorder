server {
  listen 80;
  server_name _;

  client_max_body_size 64m;

  location /api/ {
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stream media straight through instead of buffering it into nginx temp
    # files — smoother playback for large video ranges. And don't drop a slow
    # upstream after the default 60s: a Telegram-backed range can legitimately
    # take longer, and a premature cut surfaces in the player as "network
    # error". 300s covers retry/backoff and brief FLOOD_WAIT pauses.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass http://api:3001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /media/ {
    alias /data/;
    add_header Cache-Control no-store;
  }

  location / {
    proxy_pass http://web:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
