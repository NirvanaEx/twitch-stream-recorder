server {
  listen 80;
  server_name _;

  # Resolve upstream names through Docker's embedded DNS on every request
  # (proxy_pass with a variable) instead of pinning the IP once at startup.
  # When a container is recreated/restarted with a new address, a pinned IP
  # turns EVERY request into a 502 until nginx itself is restarted — that is
  # exactly the "админка отдаёт 502, пока не перезапустишь всё" failure.
  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 64m;

  # Compress the JSON the API returns. Without this the chat of a three-hour
  # broadcast leaves here as ~16 MB of plain text — the page opened, the video
  # started, and the tab then sat frozen for half a minute pulling it. It is
  # repeated field names for the most part, so it deflates roughly eightfold.
  #
  # `gzip_proxied any` is the line that actually matters: with the default
  # (`off`) nginx compresses nothing that came from an upstream, which is
  # everything here.
  #
  # The types are listed explicitly, and video/* is deliberately absent:
  # ":id/video" serves byte ranges of an mp4 through this same location, and
  # compressing those would burn CPU on incompressible data and break ranges.
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain
             image/svg+xml application/manifest+json;

  # $http_host, NOT $host: $host strips the port, and the userscript routes
  # (/twitch-audio.user.js, /twitch-audio.payload.js) rebuild the public
  # server address from this header. With the port stripped they would bake
  # an unreachable http://<ip> instead of http://<ip>:9000 into the script.

  location /api/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stream media straight through instead of buffering it into nginx temp
    # files — smoother playback for large video ranges. And don't drop a slow
    # upstream after the default 60s: a Telegram-backed range can legitimately
    # take longer, and a premature cut surfaces in the player as "network
    # error". 300s covers retry/backoff and brief FLOOD_WAIT pauses.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /socket.io/ {
    set $ws_upstream http://api:3001;
    proxy_pass $ws_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_connect_timeout 5s;
    # socket.io pings every ~25s, so an idle-but-alive connection never trips
    # this; only a genuinely dead peer does.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location /media/ {
    alias /data/;
    add_header Cache-Control no-store;
  }

  location / {
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
  }
}
