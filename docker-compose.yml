services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twitch_recorder}
      POSTGRES_USER: ${POSTGRES_USER:-twitch_recorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Hard memory ceilings on every container: without them a leak in any one
    # service eats the whole host, the kernel OOM-killer fires at random and
    # the panel answers 502 until someone reboots the server.
    mem_limit: ${POSTGRES_MEM_LIMIT:-384m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cap redis itself too — an unbounded keyspace grows silently.
    command:
      [
        "redis-server",
        "--maxmemory",
        "48mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    mem_limit: ${REDIS_MEM_LIMIT:-96m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3001}
      # Cap the V8 heap well below the container limit so Node aborts and
      # restarts cleanly instead of freezing the host. Raw Buffers (the
      # Telegram chunk cache) live OUTSIDE this heap — the container limit
      # covers those plus the streamlink/ffmpeg child processes.
      NODE_OPTIONS: "--max-old-space-size=${API_HEAP_MB:-512}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-twitch_recorder}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-twitch_recorder}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-123}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      KICK_CLIENT_ID: ${KICK_CLIENT_ID:-}
      KICK_CLIENT_SECRET: ${KICK_CLIENT_SECRET:-}
      TWITCH_EVENTSUB_SECRET: ${TWITCH_EVENTSUB_SECRET}
      # Optional .env fallback for the Telegram storage credentials; they are
      # normally configured from the admin panel (Settings -> Telegram).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      # Telegram playback tuning (all share one MTProto connection, so fewer
      # parallel chunks is often steadier than more). Override in .env.
      TELEGRAM_STREAM_PARALLELISM: ${TELEGRAM_STREAM_PARALLELISM:-6}
      TELEGRAM_STREAM_CACHE_MB: ${TELEGRAM_STREAM_CACHE_MB:-64}
      TELEGRAM_STREAM_MAX_CONCURRENT: ${TELEGRAM_STREAM_MAX_CONCURRENT:-3}
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - runtime-data:/data
    mem_limit: ${API_MEM_LIMIT:-1200m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:$${PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3000}
      NODE_OPTIONS: "--max-old-space-size=${WEB_HEAP_MB:-256}"
      NEXT_PUBLIC_API_BASE_URL: ${APP_BASE_URL}/api
      NEXT_PUBLIC_WS_BASE_URL: ${APP_BASE_URL}
    depends_on:
      - api
    mem_limit: ${WEB_MEM_LIMIT:-384m}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:$${PORT}/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-9000}:80"
    depends_on:
      - web
      - api
    volumes:
      - runtime-data:/data:ro
    mem_limit: ${NGINX_MEM_LIMIT:-64m}

volumes:
  postgres-data:
  redis-data:
  runtime-data:
