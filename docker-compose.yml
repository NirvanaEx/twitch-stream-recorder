services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twitch_recorder}
      POSTGRES_USER: ${POSTGRES_USER:-twitch_recorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-twitch_recorder}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-twitch_recorder}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TWITCH_EVENTSUB_SECRET: ${TWITCH_EVENTSUB_SECRET}
      DATA_DIR: /data
    depends_on:
      - postgres
      - redis
    volumes:
      - runtime-data:/data

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-twitch_recorder}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-twitch_recorder}
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
    depends_on:
      - postgres
      - redis
    volumes:
      - runtime-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3000}
      NEXT_PUBLIC_API_BASE_URL: ${APP_BASE_URL}/api
      NEXT_PUBLIC_WS_BASE_URL: ${APP_BASE_URL}
    depends_on:
      - api

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-9000}:80"
    depends_on:
      - web
      - api
    volumes:
      - runtime-data:/data:ro

volumes:
  postgres-data:
  redis-data:
  runtime-data:
